# Baseline defensiva para Eclipse Mosquitto 2.1.2.
# Perfil conservador para um host dedicado com cerca de 2 GiB de RAM.
# Meça e ajuste limites; não copie valores para uma carga desconhecida.

user mosquitto

# Listener MQTT TLS/mTLS na interface LAN estática.
listener 8883 192.168.0.100
protocol mqtt
socket_domain ipv4
max_connections 1000
listener_allow_anonymous false

# TLS 1.2 é o mínimo; TLS 1.3 continua habilitado.
cafile /etc/mosquitto/certs/iot-root-ca.pem
certfile /etc/mosquitto/certs/broker-chain.pem
keyfile /etc/mosquitto/certs/broker-key.pem
crlfile /etc/mosquitto/certs/iot-clients.crl.pem
require_certificate true
# Exija CN único por dispositivo na política da CA.
use_identity_as_username true
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

# O CN do certificado mTLS vira username e é restringido por ACL.
# Em 2.1 esta diretiva ainda funciona, embora a migração futura para o
# plugin acl-file seja recomendada antes do Mosquitto 3.0.
acl_file /etc/mosquitto/acl
check_retain_source true

# Limites globais contra connection/session storms e clientes sem keep-alive.
global_max_connections 1000
global_max_clients 1500
max_keepalive 300

# Limites contra pacotes gigantes, fan-out acumulado e consumidores lentos.
max_packet_size 262144
message_size_limit 131072
max_inflight_messages 20
max_inflight_bytes 262144
max_queued_messages 100
max_queued_bytes 262144
queue_qos0_messages false

# Se o pacote Mosquitto tiver sido compilado com memory tracking, habilite
# também este hard cap (512 MiB). Teste a opção antes de colocá-la em produção.
# memory_limit 536870912

# Evita crescimento indefinido de sessões abandonadas e retained expirados.
persistent_client_expiration 7d
retain_expiry_interval 60

# Persistência. O snapshot frequente reduz a janela de perda, mas não substitui
# filesystem confiável, backup, shutdown gracioso e teste de restore.
persistence true
persistence_location /var/lib/mosquitto/
persistence_file mosquitto.db
autosave_interval 120
autosave_on_changes false

# Menor volume de trabalho no event loop durante connection storms.
connection_messages false
log_dest syslog
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
sys_interval 30
set_tcp_nodelay false

# Mantém comportamento MQTT normativo.
upgrade_outgoing_qos false
