[package]
name = "mqtt-broker"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "mqtt-broker"
description = "Broker MQTT 3.1.1 experimental, limitado e durável, escrito em Rust"
readme = "README.md"
repository = "https://github.com/licodevone/xmqr"
license = "MIT"
keywords = ["mqtt", "broker", "iot", "async", "rust"]
categories = ["network-programming"]

[dependencies]
argon2 = "0.5.3"
crc32fast = "1.5.2"
fs2 = "0.4.3"
futures-util = "0.3.34"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.5.4"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Panic isolation via tokio::spawn/catch_unwind requires unwinding rather than process abort.
panic = "unwind"
strip = "symbols"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
