[package]
name = "xmqr-windows-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Local Windows tray manager for installed XMQR components"

[[bin]]
name = "xmqr-manager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
fs2 = "0.4"
tray-icon = { version = "=0.25.1", default-features = false }
tao = "=0.37.1"
winreg = "0.55"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.release]
strip = "symbols"
lto = "thin"

