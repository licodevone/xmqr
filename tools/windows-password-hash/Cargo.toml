[package]
name = "xmqr-windows-password-hash"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Bounded stdin password hashing for secure XMQR Windows initial setup"
license = "MIT"

[dependencies]
argon2 = "=0.5.3"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.9.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
