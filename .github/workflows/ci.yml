name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 scripts/license_inventory.py --check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mosquitto-clients
      - run: cargo build --locked --bins
      - run: python3 scripts/verify_interop.py --broker target/debug/mqtt-broker
      - run: python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/xmqr-paho" paho-mqtt==2.1.0
      - run: PYTHONPATH="$RUNNER_TEMP/xmqr-paho" python3 scripts/verify_paho_mqtt5.py --broker target/debug/mqtt-broker
      - run: python3 scripts/verify_mqtt5_negative_puback.py
      - run: python3 scripts/verify_mqtt5_negative_pubrec.py
      - run: python3 scripts/verify_mqtt5_qos2_completion_reasons.py
      - run: python3 scripts/verify_mqtt5_disconnect_with_will.py
      - run: python3 scripts/verify_mqtt5_client_disconnect_reasons.py
      - run: python3 scripts/verify_mqtt5_oversize_disconnect.py
      - run: python3 scripts/verify_mqtt5_alias_error_disconnect.py
      - run: python3 scripts/verify_mqtt5_malformed_length_disconnect.py
      - run: python3 scripts/verify_mqtt5_fixed_header_flags_disconnect.py
      - run: python3 scripts/verify_mqtt5_subscription_user_properties.py
      - run: python3 scripts/verify_mqtt5_subscription_property_disconnect.py
      - run: python3 scripts/verify_mqtt5_connect_property_reason.py
      - run: python3 scripts/verify_mqtt5_connect_property_semantic_reason.py
      - run: python3 scripts/verify_mqtt5_publish_property_reasons.py
      - run: python3 scripts/verify_mqtt5_control_property_reasons.py
      - run: python3 scripts/verify_mqtt5_ack_property_reasons.py
      - run: python3 scripts/verify_mqtt5_zero_qos_ack_id.py
      - run: python3 scripts/verify_mqtt5_zero_command_id.py
      - run: python3 scripts/verify_mqtt5_publish_fixed_header_reasons.py
      - run: python3 scripts/verify_mqtt5_second_connect.py
      - run: python3 scripts/verify_mqtt5_malformed_utf8.py
      - run: python3 scripts/verify_mqtt5_connect_utf8_reason.py
      - run: python3 scripts/verify_mqtt5_truncated_fields.py
      - run: python3 scripts/verify_mqtt5_connect_structure.py
      - run: python3 scripts/verify_mqtt5_subscription_pubrel_fixed_flags.py
      - run: python3 scripts/verify_mqtt5_server_only_packet_reasons.py
      - run: python3 scripts/verify_mqtt5_reserved_control_type.py
      - run: python3 scripts/verify_mqtt5_auth_fixed_flags.py
      - run: python3 scripts/verify_mqtt5_initial_connect_flags.py
      - run: python3 scripts/verify_shutdown.py --broker target/debug/mqtt-broker

  ubuntu-package:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git curl ca-certificates build-essential cmake perl pkg-config python3 dpkg-dev systemd
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/build_deb.py
      - run: apt-get install -y ./dist/*.deb
      - run: systemd-analyze verify /usr/lib/systemd/system/xmqr-broker.service
      - uses: actions/upload-artifact@v4
        with:
          name: xmqr-broker-ubuntu26-amd64
          path: dist/*
