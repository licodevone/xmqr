name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 scripts/license_inventory.py --check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mosquitto-clients
      - run: cargo build --locked --bins
      - run: python3 scripts/verify_interop.py --broker target/debug/mqtt-broker
