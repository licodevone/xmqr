name: Desktop Managers

on:
  push:
    paths: ['tools/windows-manager/**', 'tools/linux-manager/**', '.github/workflows/desktop-managers.yml']
  pull_request:
    paths: ['tools/windows-manager/**', 'tools/linux-manager/**', '.github/workflows/desktop-managers.yml']

permissions:
  contents: read

jobs:
  windows-manager:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/windows-manager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/windows-manager
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release

  ubuntu-manager:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates python3 python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb xauth dbus-x11 desktop-file-utils
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/linux-manager/tests -v
      - run: dbus-run-session -- xvfb-run -a python3 tools/linux-manager/tests/gui_smoke.py
      - run: desktop-file-validate tools/linux-manager/xmqr-manager.desktop tools/linux-manager/xmqr-manager-autostart.desktop
      - run: python3 tools/linux-manager/build_deb.py --output dist/linux-manager
      - run: dpkg-deb --info dist/linux-manager/*.deb
      - run: python3 tools/linux-manager/tests/package_smoke.py dist/linux-manager/xmqr-manager_0.1.0-1_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: xmqr-manager-ubuntu26
          path: dist/linux-manager/*
